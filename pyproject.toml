[project]
name = "etfs"
version = "0.1.0"
description = "Daily ETF OHLCV and technical indicators"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Steven Rossi" }]
dependencies = [
    "numpy>=2.0",  # technicals: np.quantile(weights=) landed in 2.0
    "polars>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
etfs-sync = "etfs.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["etfs*"]
